name: Secret Scan by Company Name

# Trigger manually, input is ONLY the company name.
on:
  workflow_dispatch:
    inputs:
      company_name:
        description: "Company name (or GitHub org/user login directly)"
        required: true
        type: string
      max_repos:
        description: "Max repos to scan (safety cap)"
        required: false
        default: "100"
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      org: ${{ steps.resolve.outputs.org }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve company name -> GitHub org
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/resolve_org.sh
          ORG=$(scripts/resolve_org.sh "${{ inputs.company_name }}")
          echo "Resolved '${{ inputs.company_name }}' -> $ORG"
          echo "org=$ORG" >> "$GITHUB_OUTPUT"

  scan:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: List repos for ${{ needs.resolve.outputs.org }}
        id: repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/list_repos.sh
          scripts/list_repos.sh "${{ needs.resolve.outputs.org }}" "${{ inputs.max_repos }}" \
            > repo_list.txt
          echo "repo_count=$(wc -l < repo_list.txt)" >> "$GITHUB_OUTPUT"
          cat repo_list.txt

      - name: Scan each repo (restore deleted files + TruffleHog)
        run: |
          chmod +x scripts/scan_repo.sh
          mkdir -p results
          while read -r repo; do
            [[ -z "$repo" ]] && continue
            scripts/scan_repo.sh "$repo" results
          done < repo_list.txt

      - name: Build smart summary
        run: |
          python3 scripts/summarize.py results "${{ inputs.company_name }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-${{ needs.resolve.outputs.org }}
          path: |
            results/summary.json
            results/summary.md
          retention-days: 14
